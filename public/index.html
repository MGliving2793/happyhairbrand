<script>
// Performance Optimized: Hide specific sections without constantly querying the DOM every 500ms
const hidePromo = () => {
    document.querySelectorAll('section').forEach(sec => {
        if (sec.innerText && (sec.innerText.includes('HAIR100') || sec.innerText.includes('Give ₹100 off'))) {
            sec.style.display = 'none';
        }
    });
};
hidePromo();
const observer = new MutationObserver((mutations) => {
    let shouldCheck = false;
    for (let m of mutations) { if (m.addedNodes.length > 0) { shouldCheck = true; break; } }
    if (shouldCheck) hidePromo();
});
observer.observe(document.body, { childList: true, subtree: true });
</script>
